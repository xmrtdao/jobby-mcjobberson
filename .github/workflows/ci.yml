name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required files present
        run: |
          set -e
          test -f resume.md || { echo "::error::resume.md missing" >&2; exit 1; }
          test -f email-template.md || { echo "::error::email-template.md missing" >&2; exit 1; }

      - name: No placeholder markers
        run: |
          set -e
          if grep -rniE "TODO|PLACEHOLDER|<insert|FIXME" resume.md email-template.md; then
            echo "::error::placeholder content found" >&2
            exit 1
          fi

      - name: No empty sections
        run: |
          set -e
          for f in resume.md email-template.md; do
            awk 'BEGIN{RS="\n\n"} { if (NF==0) empty++ } END{ if (empty>0) exit 1 }' "$f" \
              || { echo "::error::$f has empty sections" >&2; exit 1; }
          done
