name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q lead_utils.py newsletter_ingest.py resume_ingest.py resume_server.py tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check static portal
        run: |
          test -f docs/index.html
          test -f docs/styles.css
          test -f docs/app.js
          node --check docs/app.js

      - name: Check diff cleanliness
        run: git diff --check HEAD^ HEAD
